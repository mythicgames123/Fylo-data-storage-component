<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fylo data storage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container">
        <div class="container-1">
            <img src="imgs/logo.svg" alt="logo">
            <div>
                <img src="imgs/icon-document.svg" alt="icon-document">
                <img src="imgs/icon-folder.svg" alt="icon-folder">
                <img src="imgs/icon-upload.svg" alt="icon-upload">
            </div>
        </div>

        <div class="container-2">
            <p>You’ve used <strong>815 GB</strong> of your storage</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="GB">
                <span>0 GB</span>
                <span>1000 GB</span>
            </p>

            <div class="empty-storage">
                <p><strong>185</strong> GB Left</p>
            </div>
        </div>
    </section>
</body>
</html>
